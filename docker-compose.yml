# The smoother behind Mile Marker's Smooth tab. It has no published port: Mile Marker reaches it
# over its Docker network and forwards the tab's requests. Start Mile Marker first so that
# network exists.
services:
  run-smooth:
    build: .
    container_name: run-smooth
    restart: unless-stopped
    # Runs as your user so you own the files in ./backups. Set PUID and PGID when you start it.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./cache:/data/cache          # mapstore.sqlite and the Overpass tile cache
      - ./backups:/data/backups      # untouched originals of every run fetched
      # smashrun_token, plus smooth_passphrase to allow replacing runs. Read on each request.
      - type: bind
        source: ${SMOOTH_SECRETS_DIR:-${HOME}/.config/mile_marker}
        target: /run/secrets/mile_marker
        read_only: true
        bind:
          create_host_path: false    # fail loudly instead of creating a folder if it's missing
      # The token file alone is writable, so a new token can be saved from the Smooth tab.
      - type: bind
        source: ${SMOOTH_SECRETS_DIR:-${HOME}/.config/mile_marker}/smashrun_token
        target: /run/secrets/mile_marker/smashrun_token
        bind:
          create_host_path: false
    networks: [mile-marker]

networks:
  mile-marker:
    external: true
    name: ${MILE_MARKER_NETWORK:-mile_marker_default}
